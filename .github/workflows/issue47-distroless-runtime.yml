name: Issue 47 distroless experimental Python 3.11 runtime

on:
  push:
    branches:
      - test/issue47-distroless-runtime-experiment-20261122

permissions:
  contents: read

jobs:
  compile-runtime:
    name: Build and validate distroless CPython 3.11 + PyTorch (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: trixie
            builder: python:3.11-slim-trixie
            runtime: gcr.io/distroless/cc-debian13:nonroot
          - variant: bookworm
            builder: python:3.11-slim-bookworm
            runtime: gcr.io/distroless/cc-debian12:nonroot
    steps:
      - uses: actions/checkout@v4
      - name: Build a local-only distroless runtime candidate
        env:
          BUILDER_IMAGE: ${{ matrix.builder }}
          RUNTIME_IMAGE: ${{ matrix.runtime }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker pull "$BUILDER_IMAGE"
          docker pull "$RUNTIME_IMAGE"
          echo "Builder: `$(docker image inspect --format '{{index .RepoDigests 0}}' "$BUILDER_IMAGE")`" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime: `$(docker image inspect --format '{{index .RepoDigests 0}}' "$RUNTIME_IMAGE")`" >> "$GITHUB_STEP_SUMMARY"
          docker build --pull -f Dockerfile.distroless-experiment \
            --build-arg "BUILDER_PYTHON_IMAGE=$BUILDER_IMAGE" \
            --build-arg "RUNTIME_BASE_IMAGE=$RUNTIME_IMAGE" \
            -t "ai-interview-distroless-test:${GITHUB_SHA}-$VARIANT" .
      - name: Runtime ABI and import tests (no network or deployment)
        run: |
          IMAGE="ai-interview-distroless-test:${GITHUB_SHA}-${{ matrix.variant }}"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          docker run --rm --network none --entrypoint /app/.venv/bin/python "$IMAGE" -c '
          import importlib.util
          import os
          import sqlite3
          import stat
          import ssl
          import sys

          assert sys.version_info[:2] == (3, 11)
          assert os.getuid() == 10001
          assert stat.S_IMODE(os.stat("/app/data").st_mode) == 0o700
          assert not os.path.exists("/app/data/question_vectors.sqlite3")
          assert importlib.util.find_spec("pip") is None
          assert importlib.util.find_spec("chromadb") is None
          connection = sqlite3.connect(":memory:")
          assert connection.execute("SELECT 1").fetchone()[0] == 1
          import fastapi
          import uvicorn
          import torch
          import sentence_transformers
          import src.api.app
          print("ABI_AND_IMPORT_SMOKE_PASS", torch.__version__)
          '
      - name: No waivers - block HIGH and CRITICAL from actual built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-distroless-test:${{ github.sha }}-${{ matrix.variant }}"
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"
