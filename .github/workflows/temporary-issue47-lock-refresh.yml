# ONE-SHOT self-removing security workflow. Never modifies main or publishes artifacts.
name: One-shot issue 47 dependency lock refresh
on:
  push:
    branches:
      - security/issue-47-dependency-updates
permissions:
  contents: write
jobs:
  resolve-lock:
    if: github.ref == 'refs/heads/security/issue-47-dependency-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv resolver
        run: python -m pip install 'uv>=0.9,<1'
      - name: Resolve audited vulnerable packages in lock
        run: |
          uv lock --upgrade-package anyio \
            --upgrade-package certifi \
            --upgrade-package chromadb \
            --upgrade-package filelock \
            --upgrade-package fsspec \
            --upgrade-package gitpython \
            --upgrade-package idna \
            --upgrade-package langsmith \
            --upgrade-package langgraph-sdk \
            --upgrade-package oauthlib \
            --upgrade-package opentelemetry-api \
            --upgrade-package pillow \
            --upgrade-package pydantic-settings \
            --upgrade-package python-multipart \
            --upgrade-package setuptools \
            --upgrade-package starlette \
            --upgrade-package sentence-transformers \
            --upgrade-package torch \
            --upgrade-package transformers \
            --upgrade-package urllib3 \
            --upgrade-package wheel
          uv lock --check
          git diff --stat -- uv.lock
      - name: Remove one-shot workflow and commit lock
        run: |
          git rm -- .github/workflows/temporary-issue47-lock-refresh.yml
          git add uv.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(security): refresh reported vulnerable dependencies in uv.lock'
          git push origin HEAD:refs/heads/security/issue-47-dependency-updates
