name: Verified Release Candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing pyproject version, e.g. v0.1.0; dry-run only"
        required: true
        type: string

# This workflow never publishes an image or deploys an environment.
# Tags and manual dispatch both require all security gates to pass.
permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-integrity:
    name: Version, source SHA, SBOM and repeatable bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version and reachability from main
        env:
          RELEASE_SHA: ${{ github.sha }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          flags=(--check-main)
          if [ "$EVENT_TYPE" = "push" ]; then
            flags+=(--check-tag-ref)
          fi
          python -m src.infrastructure.operations.release_cli verify-source \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" "${flags[@]}"

      - name: Build and re-verify deterministic source tarball
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash ops/release/build_bundle.sh

      - name: Install uv to generate runtime CycloneDX SBOM
        run: python -m pip install "uv>=0.9,<1"

      - name: Generate CycloneDX SBOM from existing lock
        run: |
          uv export --locked --no-dev --format cyclonedx1.5 \
            --output-file dist/runtime-sbom.cdx.json
          python -m json.tool dist/runtime-sbom.cdx.json >/dev/null
          sha256sum dist/runtime-sbom.cdx.json > dist/runtime-sbom.sha256

      - name: Upload verified source, checksum and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-source
          path: dist/
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    name: Runtime dependency vulnerability gate
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated uv and pip-audit
        run: python -m pip install "uv>=0.9,<1" "pip-audit>=2.9,<3"

      - name: Export pinned runtime dependencies
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project \
            --format requirements.txt \
            --output-file runtime-requirements.txt

      - name: Fail release on known runtime dependency vulnerabilities
        run: pip-audit --no-deps --strict -r runtime-requirements.txt

  container-scan:
    name: Build and scan production container, no registry publish
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require approved immutable Python base-image digest
        env:
          APPROVED_PYTHON_BASE_IMAGE: ${{ vars.APPROVED_PYTHON_BASE_IMAGE }}
        run: python -m src.infrastructure.operations.verify_release_base_image

      - name: Build candidate image locally
        id: build_image
        env:
          APPROVED_PYTHON_BASE_IMAGE: ${{ vars.APPROVED_PYTHON_BASE_IMAGE }}
        run: |
          docker build --pull -f Dockerfile.release \
            --build-arg "PYTHON_IMAGE=${APPROVED_PYTHON_BASE_IMAGE}" \
            -t "ai-interview-release-candidate:${GITHUB_SHA}" .

      - name: Validate production candidate in an isolated read-only container
        run: |
          bash ops/release/verify_container_runtime.sh \
            "ai-interview-release-candidate:${GITHUB_SHA}"

      - name: Fail on HIGH/CRITICAL vulnerabilities in the built image
        if: always() && steps.build_image.outcome == 'success'
        # This action is pinned to a verified post-incident source commit.
        # Do not switch to mutable tags. Reviewed v0.36.0 commit:
        # https://github.com/aquasecurity/trivy-action/commit/ed142fd0673e97e23eac54620cfb913e5ce36c25
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-release-candidate:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"

      - name: Check container runs as an unprivileged numeric user
        run: |
          test "$(docker image inspect \
            "ai-interview-release-candidate:${GITHUB_SHA}" \
            --format '{{.Config.User}}')" = "10001:10001"

  provenance:
    name: Sign the release source provenance
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download exact bundle from source-integrity job
        uses: actions/download-artifact@v4
        with:
          name: verified-release-source
          path: dist/

      - name: Generate GitHub artifact provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.tar.gz

  release-ready:
    name: All release candidate gates passed (no deploy)
    needs: [source-integrity, dependency-audit, container-scan, provenance]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read

    steps:
      - name: Record gated release candidate result
        run: |
          echo "Source verified, lock audited, image scanned, provenance signed."
          echo "No deployment or registry publication has been performed."
          echo "Operator must independently check backups, rollback and approval."
