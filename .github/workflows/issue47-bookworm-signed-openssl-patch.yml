name: Issue 47 signed Bookworm OpenSSL image patch experiment

on:
  push:
    branches:
      - test/issue47-bookworm-signed-openssl-patch-20261122

permissions:
  contents: read

jobs:
  vendor-zlib-prerequisite:
    name: Signed Bookworm zlib security prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify candidate package from Debian's signed APT repositories
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull always debian:bookworm-slim /bin/sh -euc '
            apt-get update >/dev/null
            candidate="$(apt-cache policy zlib1g | sed -n "s/^[[:space:]]*Candidate: //p" | head -n 1)"
            test -n "$candidate" && test "$candidate" != "(none)"
            printf "Signed Debian Bookworm zlib1g candidate: %s\\n" "$candidate"
            if ! dpkg --compare-versions "$candidate" gt "1:1.2.13.dfsg-1"; then
              echo "BLOCKED: no newer vendor zlib1g package found than the known affected Bookworm version." >&2
              echo "Do not disable Trivy or alter dpkg metadata to force a green result." >&2
              exit 1
            fi
            echo "A newer candidate exists; this alone does NOT prove the CVE is fixed."
          '
      - name: Record unwaived security policy
        if: always()
        run: |
          {
            echo "## Issue #47: release remains blocked unless EVERY gate passes"
            echo "This preflight reads signed Debian Bookworm APT metadata and checks for a newer zlib1g candidate."
            echo "A newer version is not a CVE fix guarantee. A human security review plus actual-image strict Trivy remain required."
            echo "No waiver, ignore list, image publish, secret access, or deployment is performed."
          } >> "$GITHUB_STEP_SUMMARY"

  signed-patch-recheck:
    needs: vendor-zlib-prerequisite
    name: Signed Debian12 package + nonroot runtime + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and retain no published artifacts
        run: |
          docker build --pull -f Dockerfile.distroless-bookworm-openssl-patch \
            -t "ai-interview-bookworm-patch:${GITHUB_SHA}" .
      - name: Confirm runtime ABI, exact package contents, and locked deps
        run: |
          IMAGE="ai-interview-bookworm-patch:${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          docker run --rm --network none --entrypoint /app/.venv/bin/python "$IMAGE" -c '
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import sqlite3
          import ssl
          import sys

          assert sys.version_info[:2] == (3, 11)
          assert os.getuid() == 10001
          print("RUNTIME_OPENSSL", ssl.OPENSSL_VERSION, ssl.OPENSSL_VERSION_INFO, flush=True)
          print("RUNTIME_OPENSSL_LIBRARY_PATHS", [
              str(path) + " -> " + str(path.resolve())
              for path in (
                  Path("/usr/local/lib/libssl.so.3"),
                  Path("/usr/lib/x86_64-linux-gnu/libssl.so.3"),
                  Path("/lib/x86_64-linux-gnu/libssl.so.3"),
              )
              if path.exists()
          ], flush=True)
          # CPython reports OpenSSL 3.0.22 as (3, 0, 0, 22, 0):
          # the fourth element is the OpenSSL patch number.
          assert ssl.OPENSSL_VERSION_INFO[:2] == (3, 0), ssl.OPENSSL_VERSION
          assert ssl.OPENSSL_VERSION_INFO[3] >= 22, (
              "loaded OpenSSL runtime is below the patched minimum: " + ssl.OPENSSL_VERSION
          )
          assert ssl.OPENSSL_VERSION_INFO[0:2] == (3, 0), ssl.OPENSSL_VERSION
          assert importlib.util.find_spec("chromadb") is None
          assert importlib.util.find_spec("pip") is None
          assert not Path("/app/data/question_vectors.sqlite3").exists()
          status = Path("/var/lib/dpkg/status.d/libssl3").read_text()
          assert "Package: libssl3" in status
          assert "Version: 3.0.22" in status or "Version: 3.0.23" in status
          md5sums = Path("/var/lib/dpkg/status.d/libssl3.md5sums").read_text()
          checked = set()
          for line in md5sums.splitlines():
              digest, name = line.split(maxsplit=1)
              if name.endswith(("/libssl.so.3", "/libcrypto.so.3")):
                  actual = hashlib.md5(Path("/" + name).read_bytes()).hexdigest()
                  assert digest == actual, name
                  checked.add(Path(name).name)
          assert checked == {"libssl.so.3", "libcrypto.so.3"}
          zlib_md5sums = Path("/var/lib/dpkg/status.d/zlib1g.md5sums").read_text()
          assert "Package: zlib1g" in Path(
              "/var/lib/dpkg/status.d/zlib1g"
          ).read_text()
          zlib_checks = []
          for line in zlib_md5sums.splitlines():
              digest, name = line.split(maxsplit=1)
              if Path(name).name.startswith("libz.so.1."):
                  zlib_checks.append(name)
                  assert digest == hashlib.md5(
                      Path("/" + name).read_bytes()
                  ).hexdigest()
          assert len(zlib_checks) == 1
          assert sqlite3.connect(":memory:").execute("SELECT 1").fetchone()[0] == 1
          import fastapi
          import uvicorn
          import torch
          import sentence_transformers
          import src.api.app
          print("SIGNED_PACKAGE_AND_ABI_PASS", ssl.OPENSSL_VERSION, torch.__version__)
          '
      - name: Verify live HTTP health under a read-only root filesystem
        run: |
          set -euo pipefail
          IMAGE="ai-interview-bookworm-patch:${GITHUB_SHA}"
          CID="$(docker run -d --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /app/data:rw,nosuid,size=64m,uid=10001,gid=10001,mode=0700 \
            -p 127.0.0.1::8000 "$IMAGE")"
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null || true' EXIT
          PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' "$CID")"
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${PORT}/api/v1/health/" > /tmp/ai-health.json; then
              grep -Fq '"status"' /tmp/ai-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Read-only nonroot container did not pass live HTTP health check" >&2
          exit 1
      - name: Strict HIGH and CRITICAL image scan without exception
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-bookworm-patch:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"
