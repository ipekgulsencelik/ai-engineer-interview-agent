name: Issue 47 SQLite isolation security recheck

on:
  push:
    branches:
      - test/issue47-sqlite-security-recheck-20261122

permissions:
  contents: read

jobs:
  runtime-dependency-audit:
    name: Strict audit of production-only uv export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install trusted pinned-major audit tooling
        run: python -m pip install "uv>=0.9,<1" "pip-audit>=2.9,<3"
      - name: Export exact locked production dependencies
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project \
            --format requirements-txt > runtime-requirements.txt
          if grep -Ei '^chromadb([=<> ]|$)' runtime-requirements.txt; then
            echo "ChromaDB remains in production dependencies" >&2
            exit 1
          fi
      - name: Block known runtime vulnerabilities without waivers
        run: pip-audit --no-deps --strict -r runtime-requirements.txt

  built-image-trivy:
    name: Trivy HIGH/CRITICAL production image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image locally with no publish
        run: |
          docker build --pull -f Dockerfile.release \
            -t "ai-interview-sqlite-recheck:${GITHUB_SHA}" .
      - name: Fail on HIGH/CRITICAL OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-sqlite-recheck:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"
      - name: Verify nonroot image identity
        run: |
          test "$(docker image inspect \
            "ai-interview-sqlite-recheck:${GITHUB_SHA}" \
            --format '{{.Config.User}}')" = "10001:10001"
