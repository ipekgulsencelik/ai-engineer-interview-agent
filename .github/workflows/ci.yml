name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-gates:
    name: Ruff + Pyright + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (required)
        run: uv run ruff check .

      - name: Pyright (required)
        run: uv run pyright

      - name: Pytest (required)
        run: uv run pytest -q

  postgres-integration:
    name: PostgreSQL + Alembic integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install lightweight PostgreSQL test dependencies
        run: uv pip install --system -r requirements-postgres.txt "pytest>=9,<10"

      - name: Apply Alembic migrations to live PostgreSQL
        env:
          POSTGRES_DATABASE_URL: postgresql+psycopg://interview:testpw@localhost:5432/interview_test
        run: python -m alembic -c db/postgres/alembic.ini upgrade head

      - name: Verify PostgreSQL integration and concurrency
        env:
          POSTGRES_TEST_DSN: postgresql://interview:testpw@localhost:5432/interview_test
        run: >-
          python -m pytest -q
          tests/infrastructure/repositories/test_postgres_monitoring_integration.py
          tests/infrastructure/repositories/test_postgres_tenant_security.py

  telemetry-sdk:
    name: OpenTelemetry SDK + Prometheus integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install lightweight telemetry SDK dependencies
        run: uv pip install --system -r requirements-observability.txt "pytest>=9,<10"

      - name: Run real SDK and bounded telemetry tests
        run: >-
          python -m pytest -q
          tests/infrastructure/telemetry/test_otel_dataset_telemetry_sdk.py
          tests/infrastructure/telemetry/test_otel_http_server_telemetry_sdk.py
          tests/infrastructure/telemetry/test_otlp_runtime_sdk.py
          tests/evaluation/dataset/observability/test_telemetry_instrumentation.py
          tests/api/test_http_dashboard_assets.py

  observability-stack:
    name: Collector + Prometheus + Alertmanager config and SLO rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML and pytest for stack contracts
        run: python -m pip install "PyYAML>=6,<7" "pytest>=9,<10"

      - name: Run private-network and provisioning contracts
        run: python -m pytest -q tests/ops/test_observability_stack_contracts.py

      - name: Create disposable local-only CI secrets
        run: |
          mkdir -p "$RUNNER_TEMP/obs-secrets"
          printf '%s' "ci-only-not-a-production-password" > "$RUNNER_TEMP/obs-secrets/grafana"
          printf '%s' "https://example.invalid/ci-only-webhook" > "$RUNNER_TEMP/obs-secrets/webhook"
          echo "GRAFANA_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/obs-secrets/grafana" >> "$GITHUB_ENV"
          echo "ALERT_WEBHOOK_URL_FILE=$RUNNER_TEMP/obs-secrets/webhook" >> "$GITHUB_ENV"

      - name: Verify Docker Compose is valid without public ports
        run: docker compose -f ops/observability/compose.yml config --quiet

      - name: Validate Collector configuration using real binary
        run: >-
          docker run --rm
          -v "$PWD/ops/observability/collector.yml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.137.0
          validate --config=/etc/otelcol-contrib/config.yaml

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/ops/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/ops/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            test rules /etc/prometheus/tests/slo.test.yml

      - name: Validate real Alertmanager routing syntax
        run: >-
          docker run --rm --entrypoint=/bin/amtool
          -v "$PWD/ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
          -v "$ALERT_WEBHOOK_URL_FILE:/run/secrets/alert_webhook_url:ro"
          prom/alertmanager:v0.28.1
          check-config /etc/alertmanager/alertmanager.yml

  postgres-ha-dr:
    name: PostgreSQL HA/DR contract + real PITR replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contract dependencies
        run: python -m pip install "PyYAML>=6,<7" "pytest>=9,<10"

      - name: Verify isolated HA/DR manifests and failover guardrails
        run: >-
          python -m pytest -q
          tests/ops/test_postgres_ha_dr_contracts.py
          tests/ops/test_postgres_failover_drill.py

      - name: Run real PostgreSQL 16 physical backup and WAL PITR drill
        run: bash ops/postgres-ha/tests/pitr_docker_drill.sh
