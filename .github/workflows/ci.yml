name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Pyright Type Check
        run: uv run pyright

      - name: Run Tests
        run: uv run pytest

      - name: Docker Build
        run: docker build -t ai-interview-agent .