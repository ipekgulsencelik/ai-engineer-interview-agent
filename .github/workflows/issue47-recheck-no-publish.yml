# Ephemeral test-only workflow, never deploys, publishes or modifies main.
name: Issue 47 dependency and image security recheck
on:
  push:
    branches:
      - test/issue47-secondpass-security-scan
permissions:
  contents: read
jobs:
  audit-lock:
    name: Audit exact updated locked runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv and pip-audit
        run: python -m pip install "uv>=0.9,<1" "pip-audit>=2.9,<3"
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-hashes --no-emit-project --format requirements.txt --output-file runtime-requirements.txt
      - name: Fail on remaining known vulnerabilities
        run: pip-audit --no-deps --strict -r runtime-requirements.txt

  built-image-vulnerability-scan:
    name: Scan the rebuilt production image (no registry)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root production image from updated lock
        run: docker build --pull -f Dockerfile.release -t "ai-interview-issue47:${GITHUB_SHA}" .
      - name: Scan built image with blocking HIGH/CRITICAL policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-issue47:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"
