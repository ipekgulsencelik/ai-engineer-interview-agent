name: Production Image PR Security

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: image-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-runtime-audit:
    name: Locked production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: python -m pip install "uv>=0.9,<1" "pip-audit>=2.9,<3"
      - name: Export locked no-dev production dependencies
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project \
            --format requirements-txt > runtime-requirements.txt
          if grep -Ei '^chromadb([=<> ]|$)' runtime-requirements.txt; then
            echo "Unpatched legacy ChromaDB in runtime dependency export" >&2
            exit 1
          fi
      - name: Block any known runtime package vulnerability
        run: pip-audit --no-deps --strict -r runtime-requirements.txt

  production-image-scan:
    name: Production image HIGH/CRITICAL gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual production Dockerfile without publishing
        run: |
          docker build --pull -f Dockerfile.release \
            -t "ai-interview-pr-security:${GITHUB_SHA}" .
      - name: Fail closed on HIGH or CRITICAL OS and library advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "ai-interview-pr-security:${{ github.sha }}"
          format: json
          output: trivy-image-findings.json
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"
          scanners: "vuln"
      - name: Summarize unsuppressed vulnerability counts
        if: always()
        run: |
          if test -s trivy-image-findings.json; then
            python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("trivy-image-findings.json").read_text())
          counts = collections.Counter(
              issue.get("Severity")
              for result in data.get("Results", [])
              for issue in result.get("Vulnerabilities", []) or []
          )
          summary = (
              "### Production image Trivy findings (blocking)\n"
              f"HIGH: {counts['HIGH']}\n"
              f"CRITICAL: {counts['CRITICAL']}\n"
              "The security job fails for any HIGH or CRITICAL finding.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PY
          fi
      - name: Preserve exact Trivy report for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-trivy-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: trivy-image-findings.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce nonroot runtime identity
        run: |
          test "$(docker image inspect \
            "ai-interview-pr-security:${GITHUB_SHA}" \
            --format '{{.Config.User}}')" = "10001:10001"
