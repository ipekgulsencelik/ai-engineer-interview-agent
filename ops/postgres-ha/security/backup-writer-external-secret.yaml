# Optional External Secrets Operator v1 integration.
# Fail closed until a real ClusterSecretStore and approved remote keys exist.
# The SecretStore permissions and secret rotation are managed out of band.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: interview-db-s3-writer
  namespace: interview-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_APPROVED_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: interview-db-s3-writer
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: REPLACE_WITH_APPROVED_BACKUP_WRITER_CREDENTIAL
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: REPLACE_WITH_APPROVED_BACKUP_WRITER_CREDENTIAL
        property: secret_access_key
