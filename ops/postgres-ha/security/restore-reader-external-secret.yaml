# Read-only recovery identity in the separate restoration namespace.
# It must not have PutObject/DeleteObject rights on the source WAL archive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: interview-db-s3-restore-reader
  namespace: interview-db-restore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_APPROVED_SECRET_STORE
    kind: ClusterSecretStore
  target:
    name: interview-db-s3-restore-reader
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: REPLACE_WITH_APPROVED_BACKUP_READER_CREDENTIAL
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: REPLACE_WITH_APPROVED_BACKUP_READER_CREDENTIAL
        property: secret_access_key
