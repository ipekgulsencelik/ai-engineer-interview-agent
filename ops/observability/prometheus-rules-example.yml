# Example alerts only: thresholds must be tuned to your production SLO.
groups:
  - name: dataset-pipeline
    rules:
      - alert: DatasetMonitorErrorRate
        expr: sum(rate(dataset_operations_total{activity="monitor",outcome="error"}[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Dataset monitoring operations are failing
      - alert: DatasetDispatchErrorRate
        expr: sum(rate(dataset_operations_total{activity="dispatch",outcome="error"}[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Dataset alert dispatch operations are failing
      - alert: InterviewAPIHigh5xxRatio
        expr: 100 * sum(rate(http_server_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(http_server_requests_total[5m])), 0.000001) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API requests exceeding the example 5 percent error ratio
      - alert: InterviewAPIHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Example HTTP p95 latency threshold exceeded
