# Example for a *single-process* metrics endpoint protected by your network.
# Prometheus runs beside the app; bind the scrape server to localhost by default.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: interview-dataset-worker
    static_configs:
      - targets:
          - 127.0.0.1:9464

rule_files:
  - prometheus-rules-example.yml
