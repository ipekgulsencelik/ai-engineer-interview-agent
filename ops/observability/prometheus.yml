# The scrape endpoint and Prometheus API remain Docker-private.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: interview-otel-collector
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: ["otel-collector:9464"]
