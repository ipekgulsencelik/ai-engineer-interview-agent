[project]
name = "ai-engineer-interview-agent"
version = "0.1.0"
description = "AI Engineer Interview Agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "groq>=1.2.0",
    "langgraph>=1.2.1",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "reportlab>=4.5.1",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.57.0",
    "structlog>=25.5.0",
    "torch>=2.11.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src", "tests"]
